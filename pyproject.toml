[project]
name = "causalcredit"
version = "0.1.0"
description = "Causal Inference Enhanced Credit Scoring System"
requires-python = ">=3.10"
dependencies = [
    "dowhy>=0.11",
    "econml>=0.15",
    "lightgbm>=4.0",
    "shap>=0.44",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "streamlit>=1.29",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "mlflow>=2.9",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "black>=24.0",
    "isort>=5.13",
    "ruff>=0.3",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"
